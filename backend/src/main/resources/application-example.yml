server:
  port: 8080

spring:
  application:
    name: bugaoshan-backend
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:50MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:55MB}
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.bugaoshan.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

file:
  upload:
    upload-path: ${FILE_UPLOAD_PATH:./uploads}

logging:
  level:
    com.bugaoshan: ${APP_LOG_LEVEL:INFO}

sms:
  mock: ${SMS_MOCK:true}
  mock-code: ${SMS_MOCK_CODE:123456}
