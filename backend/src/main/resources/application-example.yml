server:
  port: 8080

spring:
  application:
    name: bugaoshan-backend
  servlet:
    multipart:
      max-file-size: ${FILE_MAX_SIZE:50MB}
      max-request-size: ${FILE_MAX_REQUEST_SIZE:55MB}
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}
      mail.smtp.ssl.enable: ${SMTP_SSL:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000
  jackson:
    property-naming-strategy: SNAKE_CASE
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.bugaoshan.entity
  configuration:
    map-underscore-to-camel-case: true

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}

file:
  upload:
    upload-path: ${FILE_UPLOAD_PATH:./uploads}

logging:
  level:
    com.bugaoshan: ${APP_LOG_LEVEL:INFO}

recovery:
  enabled: ${RECOVERY_ENABLED:false}
  from: ${SMTP_FROM:}
  hmac-secret: ${RECOVERY_HMAC_SECRET:}

sms:
  mock: ${SMS_MOCK:true}
  mock-code: ${SMS_MOCK_CODE:123456}
