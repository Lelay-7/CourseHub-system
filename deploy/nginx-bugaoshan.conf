# =============================================================================
# 不高山选课通 — Nginx 站点配置
# =============================================================================
# 使用说明：
#   1. 复制到 /etc/nginx/sites-available/bugaoshan
#   2. sudo ln -s /etc/nginx/sites-available/bugaoshan /etc/nginx/sites-enabled/
#   3. sudo nginx -t && sudo systemctl reload nginx
# =============================================================================

server {
    listen 80;
    server_name _;   # 先使用 IP 访问，后续替换为域名

    root /opt/bugaoshan/frontend/dist;
    index index.html;

    # ---- 静态资源长期缓存（7天） ----
    # 带 hash 的 JS/CSS 以及图片字体等可安全缓存，避免每次请求
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ---- 前端 history 路由 fallback（HTML 不缓存） ----
    # index.html 和 Vue history 路由页面必须禁止缓存，否则旧缓存会
    # 导致登录态判断错误、空白页、JS 404 等问题
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ---- /api/api/ 双重前缀兼容（必须放在 /api/ 之前） ----
    # 部分旧版或缓存客户端可能仍然使用 /api/api/... 路径
    location /api/api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ---- API 代理到后端 ----
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
